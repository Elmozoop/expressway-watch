# Netlify configuration for Expressway Watch
# Builds from repo root, publishes docs/

[build]
  base = "."
  publish = "docs"
  command = "bash tools/netlify_build.sh"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
